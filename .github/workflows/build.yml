name: build-btusb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu bc flex bison libssl-dev xz-utils

      - name: Fetch linux 4.9.170
        run: |
          curl -sSLo linux.tar.xz https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.170.tar.xz
          tar xf linux.tar.xz

      - name: Configure with vendor config
        run: |
          cd linux-4.9.170
          cp ../config.txt .config
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "--- key options ---"
          grep -E 'CONFIG_(BT_HCIBTUSB|MODVERSIONS|MODULE_SIG|SMP|PREEMPT|MODULE_UNLOAD|LOCALVERSION)=' .config || true

      - name: modules_prepare
        run: |
          cd linux-4.9.170
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS="-O2 -fcommon" modules_prepare -j$(nproc)
          cp ../Module.symvers .
          echo "symvers lines: $(wc -l < Module.symvers)"

      - name: Build btusb
        run: |
          cd linux-4.9.170
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS="-O2 -fcommon" M=drivers/bluetooth modules -j$(nproc)

      - name: Fetch bluez tools
        run: |
          curl -sSLo bluez.tar.xz https://mirrors.edge.kernel.org/pub/linux/bluetooth/bluez-5.55.tar.xz
          tar xf bluez.tar.xz

      - name: Build hcitool / hciconfig (static aarch64)
        run: |
          cd bluez-5.55
          cat > shim.c <<'EOF'
          #include <string.h>
          #include "lib/bluetooth.h"
          int batocomp(const bdaddr_t *a, const bdaddr_t *b) { return memcmp(a, b, sizeof(bdaddr_t)); }
          EOF
          aarch64-linux-gnu-gcc -static -O2 -D_GNU_SOURCE -DVERSION='"5.55"' -I. -Ilib -o hcitool tools/hcitool.c lib/bluetooth.c lib/hci.c shim.c
          aarch64-linux-gnu-gcc -static -O2 -D_GNU_SOURCE -DVERSION='"5.55"' -I. -Ilib -o hciconfig tools/hciconfig.c tools/csr.c lib/bluetooth.c lib/hci.c shim.c
          aarch64-linux-gnu-gcc -static -O2 -D_GNU_SOURCE -I. -Ilib -o btscan ../tools/btscan.c
          ls -l hcitool hciconfig btscan
          aarch64-linux-gnu-readelf -h hcitool | grep -E 'Class|Machine'

      - name: Collect
        run: |
          mkdir -p out
          cp linux-4.9.170/drivers/bluetooth/*.ko out/
          cp bluez-5.55/hcitool bluez-5.55/hciconfig bluez-5.55/btscan out/
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: btusb-ko
          path: out/*
          if-no-files-found: error
