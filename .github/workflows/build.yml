name: build-btusb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [ default, relcrc ]
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu bc flex bison libssl-dev xz-utils

      - name: Fetch linux 4.9.170
        run: |
          curl -sSLo linux.tar.xz https://cdn.kernel.org/pub/linux/kernel/v4.x/linux-4.9.170.tar.xz
          tar xf linux.tar.xz
          echo "tree ok: $(ls linux-4.9.170/Makefile)"

      - name: Configure with vendor config
        run: |
          cd linux-4.9.170
          cp ../config.txt .config
          if [ "${{ matrix.variant }}" = "relcrc" ]; then
            echo "CONFIG_MODULE_REL_CRCS=y" >> .config
          fi
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig
          echo "--- key options ---"
          grep -E 'CONFIG_(BT_HCIBTUSB|MODVERSIONS|MODULE_REL_CRCS|MODULE_SIG|SMP|PREEMPT|MODULE_UNLOAD|LOCALVERSION)=' .config || true

      - name: modules_prepare
        run: |
          cd linux-4.9.170
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules_prepare -j$(nproc)
          cp ../Module.symvers .
          echo "symvers lines: $(wc -l < Module.symvers)"

      - name: Build btusb
        run: |
          cd linux-4.9.170
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- M=drivers/bluetooth modules -j$(nproc)

      - name: Inspect
        run: |
          cd linux-4.9.170
          ls -l drivers/bluetooth/*.ko
          for f in drivers/bluetooth/*.ko; do
            echo "== $f"
            strings "$f" | grep -m1 'vermagic' || true
            aarch64-linux-gnu-readelf -h "$f" | grep -E 'Class|Machine'
            aarch64-linux-gnu-objdump -h "$f" | grep -E '__versions|__ksymtab|modinfo' || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: btusb-${{ matrix.variant }}
          path: linux-4.9.170/drivers/bluetooth/*.ko
          if-no-files-found: error
